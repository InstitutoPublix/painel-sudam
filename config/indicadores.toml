# Indicadores exibidos no painel, na ordem em que aparecem.
#
# Para incluir um indicador: acrescente um bloco [[indicador]] com o ID da aba "Lista de Indicadores",
# rode `python scripts/build_data.py` e suba os arquivos de build/ para a pasta painel/ do bucket.
#
# Só o `id` é obrigatório. Os demais campos sobrescrevem o que vem da ficha:
#   rotulo     nome curto exibido no painel (padrão: nome do indicador na ficha)
#   unidade    unidade exibida (padrão: "Unidade de Medida" da ficha)
#   coluna     nome da coluna nas abas de recorte, quando difere do nome na ficha
#   agregacao  como calcular a Amazônia Legal a partir dos municípios: "soma", "media_ponderada", "media_simples" ou "publicado"
#              (padrão: "Regra de Agregação Territorial" da ficha)
#   peso       ID do indicador usado como peso na média ponderada (obrigatório nesse caso)
#   cobertura_minima  % mínima dos municípios da Amazônia Legal com dado para calcular o agregado de um ano
#              (padrão 90, ou o valor de --cobertura-minima); abaixo disso o ano fica sem Amazônia Legal
#   fator_municipal  multiplica só os valores da aba municipal (ex.: 100 para sinalizadores 0/1 que nas outras
#              abas vêm em %); use quando os níveis da planilha estiverem em escalas diferentes
#   formato    "numero" | "percentual" | "moeda" (padrão: deduzido da unidade)
#   casas      casas decimais
#   escala     multiplicador até a unidade exibida (ex.: valores em R$ mil -> 1000)
#   log        true para usar escala logarítmica em mapas, histogramas e dispersões
#   icone      texto curto exibido nos cartões
#   chave      identificador da entrada no painel, quando a mesma ficha gera mais de uma (padrão: o `id`)
#   categoria  usa a coluna "Nome do indicador — categoria" das abas de recorte (ex.: "Bovino" no IND-075)
#   somar_categorias  true para somar todas as colunas "Nome do indicador — …" (ex.: empresas de todos os setores)
#   categorias lista de categorias a somar (ex.: ["Ótimo", "Bom"] para rodovias em estado bom ou ótimo)
#   peso_coluna  coluna da planilha usada como peso na média ponderada, quando ela não é um indicador do painel
#   nota_agregacao  texto curto sobre o cálculo da Amazônia Legal (aproximação, ou por que ela fica sem valor)
#   peso_censo   usa a população do Censo (assets/censo_municipios.csv, gerado por scripts/censo_ibge.py) como peso da média
#                ponderada: "pop_total", "pop_urbana", "pop_0_14", "pop_15_64" ou "pop_65_mais"
#   agregacao = "soma_estados"  a Amazônia Legal é a soma dos estados dela (quando o dado municipal é parcial)

