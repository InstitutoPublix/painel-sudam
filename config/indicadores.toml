# --- Lote 3 (agregação conferida contra os valores oficiais da aba Estadual) --------------------------------

[[indicador]]
id = "IND-101"
rotulo = "Famílias de baixa renda no CadÚnico"
# peso conferido: ponderar pelas famílias cadastradas (IND-102) reproduz exatamente o valor estadual da planilha
peso = "IND-102"

# Existência de plano, lei, fundo ou consórcio: 0/1 por município; Estados e regiões trazem o % de municípios.
# Média simples x 100 reproduz o valor estadual da planilha (IND-064/066/067 exato; IND-061 com até 1,8 pp,
# por um município sem dado).
[[indicador]]
id = "IND-061"
rotulo = "Municípios com Plano Diretor"
unidade = "% dos municípios"
agregacao = "media_simples"
fator_municipal = 100

[[indicador]]
id = "IND-064"
rotulo = "Municípios com instrumento de gestão ambiental sobre o clima"
# 2020 tem 89,6% dos municípios com dado; abaixo dos 90% padrão por 0,4 ponto
cobertura_minima = 89
unidade = "% dos municípios"
agregacao = "media_simples"
fator_municipal = 100

[[indicador]]
id = "IND-066"
rotulo = "Municípios com Fundo de Meio Ambiente"
unidade = "% dos municípios"
agregacao = "media_simples"
