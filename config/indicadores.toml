# --- Lote 5: planilha com todos os indicadores (out/2026) ------------------------------------------------
# Regra da Amazônia Legal conferida contra a aba Estadual: a regra aplicada aos municípios de cada estado precisa
# reproduzir o valor estadual publicado. Três situações:
#   soma conferida          reproduz os totais estaduais (municípios sem dado contam como zero: cobertura_minima = 0)
#   média ponderada         exata quando a planilha traz o denominador; senão, aproximação com o peso mais próximo
#                           do conceito (população, matrículas da etapa, vínculos, PIB), aceita só se a diferença
#                           mediana for ≤ 1,5% e a de 9 em cada 10 estados-ano ≤ 5,5% (anotada em nota_agregacao)
#   publicado               nenhuma regra reproduz os estados: a Amazônia Legal fica sem valor, com o motivo
# Indicadores com várias colunas ("Nome — categoria") usam `categoria`, ou `somar_categorias` quando as categorias
# somam o total. Ficaram de fora IND-152, IND-153 e IND-171 (só municípios; a ficha desaconselha agregar).

